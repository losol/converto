name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push tags, create releases, push the version PR
  pull-requests: write # open/update the "Version Packages" PR
  actions: write # dispatch the Docker workflow on the new tag

jobs:
  release:
    name: Version / release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changesets needs full history & tags

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # When changesets exist on main -> opens/updates the "Version Packages" PR.
      # When none exist (that PR just merged) -> runs the publish command below,
      # which tags v<version>, cuts a GitHub Release, and triggers the Docker build.
      - name: Create release PR or publish release
        uses: changesets/action@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
        with:
          version: pnpm changeset version
          publish: bash scripts/release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
